name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/ovara-next.log 2>&1 &
          echo $! > /tmp/ovara-next.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ovara-next.log
          exit 1
      - run: npm run test:runtime
      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/ovara-next.pid ]; then
            kill "$(cat /tmp/ovara-next.pid)" || true
          fi
